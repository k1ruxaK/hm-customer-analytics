services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: hm-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./data:/data:ro
      - ./sql:/sql:ro
    environment:
      CLICKHOUSE_DB: hm
      CLICKHOUSE_USER: analyst
      CLICKHOUSE_PASSWORD: analyst
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  superset:
    build:
      context: .
      dockerfile: Dockerfile.superset
    container_name: hm-superset
    ports:
      - "8088:8088"
    volumes:
      - superset_data:/app/superset_home
    environment:
      SUPERSET_SECRET_KEY: "hm_analytics_secret_key_2024"
    depends_on:
      clickhouse:
        condition: service_healthy

volumes:
  clickhouse_data:
  superset_data: